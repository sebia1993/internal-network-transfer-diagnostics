<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>접근 인증 · 내부망 전송 진단</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body class="login-page">
    <main class="login-card panel">
      <h1>내부망 전송 진단</h1>
      <p>서버 PC의 접근 토큰을 입력하세요. 토큰은 브라우저 주소나 명령행 인수에 넣지 않습니다.</p>
      {% if error %}
        <div class="notice error" role="alert">{{ error }}</div>
      {% endif %}
      <form action="{{ url_for('access_login') }}" method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <label>
          <span>접근 토큰</span>
          <input
            type="password"
            name="access_token"
            required
            autocomplete="current-password"
            spellcheck="false">
        </label>
        <button type="submit" class="primary">로그인</button>
      </form>
      <p class="muted">HTTP는 전송 내용을 암호화하지 않습니다. 신뢰할 수 있는 내부망·VPN 또는 TLS 역방향 프록시에서 사용하세요.</p>
    </main>
  </body>
</html>
