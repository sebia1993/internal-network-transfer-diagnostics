name: PR Validation

on:
  pull_request:
  push:
    branches:
      - main
      - "portfolio/**"

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-verify:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install hash-pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed with exit code $LASTEXITCODE" }

      - name: Run source regression checks
        shell: pwsh
        run: |
          function Assert-NativeSuccess {
            param([string]$Operation, [int]$ExitCode)
            if ($ExitCode -ne 0) { throw "$Operation failed with exit code $ExitCode" }
          }
          python -m compileall access_security.py app_version.py app.py bounded_server.py probe_client.py startup_ports.py runtime_stability.py upload_transactions.py measurement_transactions.py network_sustained.py sustained_excel.py excel_report.py network_measurement.py result_storage.py network_probe tests tools
          Assert-NativeSuccess "Python compileall" $LASTEXITCODE
          node --check static/security.js
          Assert-NativeSuccess "security.js syntax check" $LASTEXITCODE
          node --check static/network_check.js
          Assert-NativeSuccess "network_check.js syntax check" $LASTEXITCODE
          node --check static/network_sustained.js
          Assert-NativeSuccess "network_sustained.js syntax check" $LASTEXITCODE
          node --check static/network_probe.js
          Assert-NativeSuccess "network_probe.js syntax check" $LASTEXITCODE
          node --check static/throughput_chart.js
          Assert-NativeSuccess "throughput_chart.js syntax check" $LASTEXITCODE
          node --check static/operations_dashboard.js
          Assert-NativeSuccess "operations_dashboard.js syntax check" $LASTEXITCODE
          python -m pytest -q
          Assert-NativeSuccess "Python regression tests" $LASTEXITCODE
          python tools/scan_tracked_secrets.py
          Assert-NativeSuccess "Tracked secret scan" $LASTEXITCODE
          python tools/run_stability_fault_suite.py
          Assert-NativeSuccess "Stability fault suite" $LASTEXITCODE
          python -m pip check
          Assert-NativeSuccess "Python dependency check" $LASTEXITCODE

      - name: Build Windows release candidate
        shell: pwsh
        run: |
          .\tools\build_windows_release.ps1 -Version v0.6.1
          if ($LASTEXITCODE -ne 0) { throw "Windows release build failed with exit code $LASTEXITCODE" }

      - name: Verify Windows release candidate
        shell: pwsh
        run: |
          python tools\verify_release_zip.py --zip dist\internal-upload_v0.6.1_windows.zip --version v0.6.1
          if ($LASTEXITCODE -ne 0) { throw "Windows release verification failed with exit code $LASTEXITCODE" }
