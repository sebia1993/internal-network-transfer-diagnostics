name: One-time web login test migration

on:
  push:
    branches:
      - remove-web-login-token

permissions:
  contents: write

jobs:
  migrate-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: remove-web-login-token

      - name: Update stale web-token tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_block(lines, start_marker, end_marker, replacement):
              start = next((i for i, line in enumerate(lines) if start_marker in line), None)
              if start is None:
                  raise SystemExit(f"start marker not found: {start_marker}")
              end = next(
                  (i for i in range(start, len(lines)) if end_marker in lines[i]),
                  None,
              )
              if end is None:
                  raise SystemExit(f"end marker not found: {end_marker}")
              return lines[:start] + replacement + lines[end + 1:]

          app_test = Path("tests/test_app.py")
          lines = app_test.read_text(encoding="utf-8").splitlines()
          if "import re" not in lines:
              insert_at = lines.index("import os") + 1
              lines.insert(insert_at, "import re")
          lines = replace_block(
              lines,
              'access_token = (config.app_root / "data/.internal-transfer-access-token").read_text(',
              'auth = {"Authorization": f"Bearer {access_token}"}',
              [
                  '    page = client.get(',
                  '        "/",',
                  '        environ_overrides={"REMOTE_ADDR": "10.10.10.5"},',
                  '    )',
                  '    csrf = re.search(',
                  '        r\'<meta name="csrf-token" content="([^\"]+)"\',',
                  '        page.get_data(as_text=True),',
                  '    )',
                  '    assert csrf is not None',
                  '    auth = {"X-CSRF-Token": csrf.group(1)}',
              ],
          )
          app_test.write_text("\n".join(lines) + "\n", encoding="utf-8")

          sustained_test = Path("tests/test_network_sustained.py")
          lines = sustained_test.read_text(encoding="utf-8").splitlines()
          if "import re" not in lines:
              insert_at = lines.index("import logging") + 1
              lines.insert(insert_at, "import re")
          lines = replace_block(
              lines,
              "def remote_auth(tmp_path: Path) -> dict[str, str]:",
              'return {"Authorization": f"Bearer {token}"}',
              [
                  'def remote_auth(client) -> dict[str, str]:',
                  '    page = client.get(',
                  '        "/",',
                  '        environ_overrides={"REMOTE_ADDR": "10.0.0.10"},',
                  '    )',
                  '    csrf = re.search(',
                  '        r\'<meta name="csrf-token" content="([^\"]+)"\',',
                  '        page.get_data(as_text=True),',
                  '    )',
                  '    assert csrf is not None',
                  '    return {"X-CSRF-Token": csrf.group(1)}',
              ],
          )
          lines = [
              line.replace("headers = remote_auth(tmp_path)", "headers = remote_auth(client)")
              for line in lines
          ]
          sustained_test.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Commit migration and remove this workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-remove-web-login-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_app.py tests/test_network_sustained.py
          git commit -m "Update remaining tests for tokenless web access"
          git push origin HEAD:remove-web-login-token
