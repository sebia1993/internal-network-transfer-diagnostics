name: One-time web login test migration

on:
  push:
    branches:
      - remove-web-login-token

permissions:
  contents: write

jobs:
  migrate-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: remove-web-login-token

      - name: Update stale web-token tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_test = Path("tests/test_app.py")
          text = app_test.read_text(encoding="utf-8")
          if "import re\n" not in text:
              text = text.replace("import os\n", "import os\nimport re\n", 1)
          old = '''    access_token = (config.app_root / "data/.internal-transfer-access-token").read_text(
              encoding="ascii"
          )
          auth = {"Authorization": f"Bearer {access_token}"}
          '''
          new = '''    page = client.get(
              "/",
              environ_overrides={"REMOTE_ADDR": "10.10.10.5"},
          )
          csrf = re.search(
              r'<meta name="csrf-token" content="([^\"]+)"',
              page.get_data(as_text=True),
          )
          assert csrf is not None
          auth = {"X-CSRF-Token": csrf.group(1)}
          '''
          if old not in text:
              raise SystemExit("test_app.py legacy auth block not found")
          app_test.write_text(text.replace(old, new, 1), encoding="utf-8")

          sustained_test = Path("tests/test_network_sustained.py")
          text = sustained_test.read_text(encoding="utf-8")
          if "import re\n" not in text:
              text = text.replace("import logging\n", "import logging\nimport re\n", 1)
          old = '''def remote_auth(tmp_path: Path) -> dict[str, str]:
              token = (tmp_path / "data/.internal-transfer-access-token").read_text(
                  encoding="ascii"
              )
              return {"Authorization": f"Bearer {token}"}
          '''
          new = '''def remote_auth(client) -> dict[str, str]:
              page = client.get(
                  "/",
                  environ_overrides={"REMOTE_ADDR": "10.0.0.10"},
              )
              csrf = re.search(
                  r'<meta name="csrf-token" content="([^\"]+)"',
                  page.get_data(as_text=True),
              )
              assert csrf is not None
              return {"X-CSRF-Token": csrf.group(1)}
          '''
          if old not in text:
              raise SystemExit("test_network_sustained.py legacy remote_auth block not found")
          text = text.replace(old, new, 1)
          text = text.replace("headers = remote_auth(tmp_path)", "headers = remote_auth(client)")
          sustained_test.write_text(text, encoding="utf-8")
          PY

      - name: Commit migration and remove this workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-remove-web-login-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_app.py tests/test_network_sustained.py
          git commit -m "Update remaining tests for tokenless web access"
          git push origin HEAD:remove-web-login-token
