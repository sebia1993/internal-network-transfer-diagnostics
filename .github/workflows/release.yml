name: Release Windows ZIP

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, for example v0.3.0"
        required: true
        default: "v0.6.1"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-zip:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^v\d+\.\d+\.\d+(?:-rc\.\d+)?$') {
            throw "Invalid release version: $env:RELEASE_VERSION"
          }
          git fetch --force --no-tags origin "refs/tags/${env:RELEASE_VERSION}:refs/tags/${env:RELEASE_VERSION}"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to fetch release tag $env:RELEASE_VERSION from origin"
          }
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag $env:RELEASE_VERSION must exist before the build starts"
          }
          $tagObjectType = (git cat-file -t "refs/tags/$env:RELEASE_VERSION").Trim()
          if ($tagObjectType -ne 'tag') {
            throw "Release tag $env:RELEASE_VERSION must be an annotated tag"
          }
          $tagCommit = (git rev-list -n 1 $env:RELEASE_VERSION).Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $headCommit) {
            throw "Release tag $env:RELEASE_VERSION points to $tagCommit, but the checked-out source is $headCommit"
          }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -ne $env:RELEASE_VERSION) {
            throw "Tag push name $env:GITHUB_REF_NAME does not match requested release $env:RELEASE_VERSION"
          }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed with exit code $LASTEXITCODE" }

      - name: Run source checks
        shell: pwsh
        run: |
          function Assert-NativeSuccess {
            param([string]$Operation, [int]$ExitCode)
            if ($ExitCode -ne 0) {
              throw "$Operation failed with exit code $ExitCode"
            }
          }
          python -m compileall access_security.py app_version.py app.py bounded_server.py probe_client.py startup_ports.py runtime_stability.py upload_transactions.py measurement_transactions.py network_sustained.py sustained_excel.py excel_report.py network_measurement.py result_storage.py network_probe tests tools
          Assert-NativeSuccess "Python compileall" $LASTEXITCODE
          node --check static/security.js
          Assert-NativeSuccess "security.js syntax check" $LASTEXITCODE
          node --check static/network_check.js
          Assert-NativeSuccess "network_check.js syntax check" $LASTEXITCODE
          node --check static/network_sustained.js
          Assert-NativeSuccess "network_sustained.js syntax check" $LASTEXITCODE
          node --check static/network_probe.js
          Assert-NativeSuccess "network_probe.js syntax check" $LASTEXITCODE
          node --check static/throughput_chart.js
          Assert-NativeSuccess "throughput_chart.js syntax check" $LASTEXITCODE
          node --check static/operations_dashboard.js
          Assert-NativeSuccess "operations_dashboard.js syntax check" $LASTEXITCODE
          python -m pytest -q
          Assert-NativeSuccess "Python regression tests" $LASTEXITCODE
          python tools/scan_tracked_secrets.py
          Assert-NativeSuccess "Tracked secret scan" $LASTEXITCODE
          python tools/run_stability_fault_suite.py
          Assert-NativeSuccess "Stability fault suite" $LASTEXITCODE
          python -m pip check
          Assert-NativeSuccess "Python dependency check" $LASTEXITCODE

      - name: Build Windows release ZIP
        shell: pwsh
        run: |
          .\tools\build_windows_release.ps1 -Version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Windows release build failed with exit code $LASTEXITCODE" }

      - name: Upload ZIP to GitHub Release
        shell: pwsh
        run: |
          $zip = "dist/internal-upload_${env:RELEASE_VERSION}_windows.zip"
          $sha = "$zip.sha256"
          $sbom = "dist/internal-upload_${env:RELEASE_VERSION}_sbom.cdx.json"
          $notes = "dist/release_notes_${env:RELEASE_VERSION}.md"
          $title = "$env:RELEASE_VERSION - 내부망 파일 전송 및 네트워크 진단"

          if (-not (Test-Path $zip)) {
            throw "Missing release ZIP: $zip"
          }
          if (-not (Test-Path $notes)) {
            throw "Missing release notes: $notes"
          }
          if (-not (Test-Path $sha)) {
            throw "Missing SHA256 file: $sha"
          }
          if (-not (Test-Path $sbom)) {
            throw "Missing SBOM file: $sbom"
          }

          $isPrerelease = $env:RELEASE_VERSION -match '-rc\.\d+$'

          gh release view $env:RELEASE_VERSION --repo $env:GITHUB_REPOSITORY *> $null
          $releaseViewExit = $LASTEXITCODE
          if ($releaseViewExit -eq 0) {
            throw "Release $env:RELEASE_VERSION already exists. Publish a new version instead of replacing an existing asset."
          }

          if ($isPrerelease) {
            gh release create $env:RELEASE_VERSION $zip $sha $sbom --repo $env:GITHUB_REPOSITORY --verify-tag --title $title --notes-file $notes --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Prerelease publication failed with exit code $LASTEXITCODE" }
          }
          else {
            gh release create $env:RELEASE_VERSION $zip $sha $sbom --repo $env:GITHUB_REPOSITORY --verify-tag --title $title --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "Release publication failed with exit code $LASTEXITCODE" }
          }
