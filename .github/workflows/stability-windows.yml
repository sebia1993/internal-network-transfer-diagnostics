name: Windows Stability Soak

on:
  schedule:
    # Sunday 18:23 UTC = Monday 03:23 KST
    - cron: "23 18 * * 0"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Soak duration in minutes"
        required: true
        default: "45"
        type: choice
        options:
          - "30"
          - "45"
          - "60"

permissions:
  contents: read

concurrency:
  group: windows-stability-soak
  cancel-in-progress: false

jobs:
  upload-tcp-restart-soak:
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      SOAK_DURATION_MINUTES: ${{ github.event.inputs.duration_minutes || '45' }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed with exit code $LASTEXITCODE" }

      - name: Run baseline tests
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "Baseline tests failed with exit code $LASTEXITCODE" }

      - name: Run upload TCP and restart soak
        shell: pwsh
        run: |
          python tools/run_windows_stability_soak.py `
            --duration-minutes $env:SOAK_DURATION_MINUTES `
            --summary-path windows-soak-summary.json
          if ($LASTEXITCODE -ne 0) { throw "Functional soak failed with exit code $LASTEXITCODE" }

      - name: Analyze soak resource trend
        shell: pwsh
        run: |
          python tools/analyze_windows_soak_summary.py `
            windows-soak-summary.json `
            --minimum-duration-minutes $env:SOAK_DURATION_MINUTES `
            --output windows-soak-analysis.json
          if ($LASTEXITCODE -ne 0) { throw "Soak analysis failed with exit code $LASTEXITCODE" }

      - name: Render bounded soak evidence
        if: always()
        shell: pwsh
        run: |
          python tools/render_windows_soak_summary.py `
            --summary windows-soak-summary.json `
            --analysis windows-soak-analysis.json `
            --output windows-soak-step-summary.md
          $renderExitCode = $LASTEXITCODE
          if (Test-Path windows-soak-step-summary.md) {
            Get-Content windows-soak-step-summary.md -Encoding UTF8 >> $env:GITHUB_STEP_SUMMARY
          }
          if ($renderExitCode -ne 0) { throw "Soak evidence rendering reported missing or invalid input with exit code $renderExitCode" }

      - name: Preserve raw soak evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-stability-soak-${{ github.run_id }}
          path: |
            windows-soak-summary.json
            windows-soak-analysis.json
            windows-soak-step-summary.md
          if-no-files-found: error
          retention-days: 14
