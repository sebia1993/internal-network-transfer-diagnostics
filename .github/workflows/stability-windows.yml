name: Windows Stability Soak

on:
  schedule:
    # Sunday 18:23 UTC = Monday 03:23 KST
    - cron: "23 18 * * 0"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Soak duration in minutes"
        required: true
        default: "45"
        type: choice
        options:
          - "30"
          - "45"
          - "60"

permissions:
  contents: read

concurrency:
  group: windows-stability-soak
  cancel-in-progress: false

jobs:
  upload-tcp-restart-soak:
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      SOAK_DURATION_MINUTES: ${{ github.event.inputs.duration_minutes || '45' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements-windows.lock

      - name: Run baseline tests
        shell: pwsh
        run: |
          python -m pytest -q

      - name: Run upload TCP and restart soak
        shell: pwsh
        run: |
          python tools/run_windows_stability_soak.py `
            --duration-minutes $env:SOAK_DURATION_MINUTES `
            --summary-path windows-soak-summary.json

      - name: Analyze soak resource trend
        shell: pwsh
        run: |
          python tools/analyze_windows_soak_summary.py `
            windows-soak-summary.json `
            --minimum-duration-minutes $env:SOAK_DURATION_MINUTES `
            --output windows-soak-analysis.json

      - name: Write soak evidence
        if: always()
        shell: pwsh
        run: |
          if (Test-Path windows-soak-analysis.json) {
            "## Windows stability analysis" >> $env:GITHUB_STEP_SUMMARY
            "``````json" >> $env:GITHUB_STEP_SUMMARY
            Get-Content windows-soak-analysis.json >> $env:GITHUB_STEP_SUMMARY
            "``````" >> $env:GITHUB_STEP_SUMMARY
          }
          if (Test-Path windows-soak-summary.json) {
            "## Windows stability soak" >> $env:GITHUB_STEP_SUMMARY
            "``````json" >> $env:GITHUB_STEP_SUMMARY
            Get-Content windows-soak-summary.json >> $env:GITHUB_STEP_SUMMARY
            "``````" >> $env:GITHUB_STEP_SUMMARY
          }
