name: Publish v0.6.1

on:
  push:
    branches:
      - publish-v0.6.1
    paths:
      - ".github/workflows/publish-v0.6.1.yml"

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: v0.6.1
      EXPECTED_SHA: ceaf2deff2dc3c920fdfa33332b1dd008d81d1b8
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out publisher branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: publish-v0.6.1
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable release source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          main_sha="$(git rev-parse origin/main)"
          if [ "$main_sha" != "$EXPECTED_SHA" ]; then
            echo "main moved: expected $EXPECTED_SHA but found $main_sha" >&2
            exit 1
          fi
          source_version="$(git show "$EXPECTED_SHA:app_version.py" | sed -n 's/^APP_VERSION = "\([^"]*\)"$/\1/p')"
          if [ "$source_version" != "$VERSION" ]; then
            echo "APP_VERSION mismatch: $source_version" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            echo "Tag $VERSION already exists" >&2
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists" >&2
            exit 1
          fi

      - name: Create annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" "$EXPECTED_SHA" -m "$VERSION - 웹 로그인 토큰 제거"
          git push origin "refs/tags/$VERSION"
          tag_type="$(git cat-file -t "refs/tags/$VERSION")"
          tag_commit="$(git rev-list -n 1 "$VERSION")"
          test "$tag_type" = "tag"
          test "$tag_commit" = "$EXPECTED_SHA"

      - name: Dispatch release workflow
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$VERSION" \
            -f version="$VERSION"
          echo "Release workflow dispatched for $VERSION"
