name: Cleanup v0.6.1 release assets

on:
  push:
    branches:
      - cleanup-v0.6.1-release-assets
    paths:
      - ".github/workflows/cleanup-v0.6.1-release-assets.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.6.1
      RELEASE_ID: "382165883"
      ZIP_ID: "543015418"
      SBOM_ID: "543015415"
      SHA256_ID: "543015413"
      ZIP_NAME: internal-upload_v0.6.1_windows.zip
      SBOM_NAME: internal-upload_v0.6.1_sbom.cdx.json
      SHA256_NAME: internal-upload_v0.6.1_windows.zip.sha256
    steps:
      - name: Delete extra release assets and verify final state
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          jq -e \
            --argjson release_id "$RELEASE_ID" \
            --argjson zip_id "$ZIP_ID" \
            --argjson sbom_id "$SBOM_ID" \
            --argjson sha256_id "$SHA256_ID" \
            --arg zip_name "$ZIP_NAME" \
            --arg sbom_name "$SBOM_NAME" \
            --arg sha256_name "$SHA256_NAME" \
            '(.id == $release_id)
             and (.assets | length == 3)
             and (any(.assets[]; .id == $zip_id and .name == $zip_name))
             and (any(.assets[]; .id == $sbom_id and .name == $sbom_name))
             and (any(.assets[]; .id == $sha256_id and .name == $sha256_name))
             and (([.assets[].name] | sort) == ([$zip_name, $sbom_name, $sha256_name] | sort))' \
            <<<"$release_json" >/dev/null

          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$SBOM_ID"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$SHA256_ID"

          final_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          jq -e \
            --argjson release_id "$RELEASE_ID" \
            --argjson zip_id "$ZIP_ID" \
            --arg zip_name "$ZIP_NAME" \
            '(.id == $release_id)
             and (.assets | length == 1)
             and (.assets[0].id == $zip_id)
             and (.assets[0].name == $zip_name)' \
            <<<"$final_json" >/dev/null

          echo "Only $ZIP_NAME remains in release $TAG."
