name: One-time release token reference cleanup

on:
  push:
    branches:
      - remove-web-login-token

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: remove-web-login-token

      - name: Remove obsolete web-token release assumptions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8-sig")
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace_once(
              "tools/verify_release_zip.py",
              '''        if parser.get("security", "ACCESS_TOKEN_FILE", fallback="") != (\n            "data/.internal-transfer-access-token"\n        ):\n            return ["config.ini has an invalid access token file setting"]\n        if not 5 <= parser.getint("security", "SESSION_TTL_MINUTES", fallback=0) <= 1440:\n            return ["config.ini has an invalid session TTL"]\n''',
              "",
          )

          replace_once(
              "tools/build_windows_release.ps1",
              '''- 루프백이 아닌 웹 접근은 토큰 로그인 또는 Bearer 인증이 필요합니다.\n- 브라우저의 상태 변경 요청은 CSRF 토큰을 검증하고 TCP 제어 프레임은 HMAC과 nonce로 재전송을 차단합니다.\n- 최초 실행 시 data/.internal-transfer-access-token이 생성되며 토큰 값은 로그나 명령행에 표시하지 않습니다.\n''',
              '''- 웹 로그인 토큰은 사용하지 않습니다. 서버 웹 포트에 도달 가능한 내부망 사용자는 화면을 바로 열 수 있습니다.\n- 브라우저의 상태 변경 요청은 CSRF 토큰을 검증하고 TCP 클라이언트 등록은 짧은 수명의 일회용 enrollment token을 유지합니다.\n- TCP 제어 프레임은 HMAC과 nonce로 재전송을 차단합니다. 웹 접근 범위는 Windows 방화벽, VLAN/ACL 또는 VPN으로 제한하세요.\n''',
          )

          replace_once(
              "tools/build_windows_release.ps1",
              '''    $SmokeTokenBytes = New-Object byte[] 48\n    $RandomNumberGenerator = [System.Security.Cryptography.RandomNumberGenerator]::Create()\n    $RandomNumberGenerator.GetBytes($SmokeTokenBytes)\n    $RandomNumberGenerator.Dispose()\n    $env:INTERNAL_TRANSFER_ACCESS_TOKEN = "build-smoke-only-" + [Convert]::ToBase64String($SmokeTokenBytes)\n    try {\n        & $PackagedServerExe --smoke-check\n        if ($LASTEXITCODE -ne 0) { throw "Server smoke check failed" }\n        & $PackagedServerExe --probe-self-check\n        if ($LASTEXITCODE -ne 0) { throw "Server probe self-check failed" }\n        & $PackagedClientExe --self-check\n        if ($LASTEXITCODE -ne 0) { throw "Client self-check failed" }\n    }\n    finally {\n        Remove-Item Env:INTERNAL_TRANSFER_ACCESS_TOKEN -ErrorAction SilentlyContinue\n    }\n''',
              '''    & $PackagedServerExe --smoke-check\n    if ($LASTEXITCODE -ne 0) { throw "Server smoke check failed" }\n    & $PackagedServerExe --probe-self-check\n    if ($LASTEXITCODE -ne 0) { throw "Server probe self-check failed" }\n    & $PackagedClientExe --self-check\n    if ($LASTEXITCODE -ne 0) { throw "Client self-check failed" }\n''',
          )

          replace_once(
              "tools/build_windows_release.ps1",
              '''- 루프백이 아닌 웹 요청에 토큰 로그인 또는 Bearer 인증을 의무화하고 브라우저 상태 변경 요청에 CSRF 검증 적용\n- TCP 제어 프레임을 프로토콜 ``v3`` HMAC-SHA256으로 인증하고 timestamp·nonce 재전송 방지 적용\n- Windows 클라이언트 등록을 짧은 수명의 일회용 enrollment token으로 제한\n- 접근 토큰은 환경 변수 또는 소유자 전용 파일에서만 읽고 토큰 값을 로그·URL·명령행에 노출하지 않음\n''',
              '''- 웹 로그인 access token과 master Bearer 인증을 제거하고 내부망에서 서버 주소를 바로 열 수 있도록 변경\n- 브라우저 상태 변경 요청의 CSRF 검증과 응답 보안 헤더는 유지\n- TCP 제어 프레임을 프로토콜 ``v3`` HMAC-SHA256으로 인증하고 timestamp·nonce 재전송 방지 적용\n- Windows 클라이언트 등록은 짧은 수명의 일회용 enrollment token을 계속 사용\n''',
          )

          replace_once(
              "tools/generate_security_artifacts.py",
              '''- 루프백이 아닌 웹 접근은 토큰 로그인 또는 Bearer 인증을 요구하며 브라우저 상태 변경 요청은 CSRF를 검증합니다.\n- TCP 제어 프레임은 HMAC-SHA256, timestamp와 nonce를 검증하고 Windows 클라이언트 등록 토큰은 짧은 시간 동안 한 번만 사용할 수 있습니다.\n''',
              '''- 웹 로그인 인증은 사용하지 않으며 서버 웹 포트에 도달 가능한 사용자는 화면을 바로 열 수 있습니다. 브라우저 상태 변경 요청은 CSRF를 검증합니다.\n- 웹 접근 범위는 Windows 방화벽, VLAN/ACL 또는 VPN으로 제한해야 합니다. TCP 제어 프레임은 HMAC-SHA256, timestamp와 nonce를 검증하고 Windows 클라이언트 등록 토큰은 짧은 시간 동안 한 번만 사용할 수 있습니다.\n''',
          )

          replace_once(
              "tests/test_release_security.py",
              '    assert "INTERNAL_TRANSFER_ACCESS_TOKEN" in script\n',
              '    assert "INTERNAL_TRANSFER_ACCESS_TOKEN" not in script\n',
          )
          PY

      - name: Commit cleanup and remove this workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-release-token-references.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/verify_release_zip.py tools/build_windows_release.ps1 tools/generate_security_artifacts.py tests/test_release_security.py
          git commit -m "Remove web token assumptions from release tooling"
          git push origin HEAD:remove-web-login-token
