name: Security Scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 19 * * 2"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan tracked files for committed secret material
        run: python tools/scan_tracked_secrets.py
